# Broker MQTT de la plataforma
per_listener_settings false
allow_anonymous false
password_file /mosquitto/passwd
acl_file /mosquitto/config/aclfile

# MQTT TCP: solo red interna de Docker (servicios de la nube)
listener 1883
# MQTT sobre WebSocket: lo publica Caddy con TLS en wss://<dominio>/mqtt
listener 9001
protocol websockets

persistence true
persistence_location /mosquitto/data/
max_queued_messages 0
max_inflight_messages 100
log_dest stdout
log_type error
log_type warning
log_type notice
