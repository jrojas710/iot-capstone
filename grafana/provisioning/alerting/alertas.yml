apiVersion: 1
contactPoints:
- orgId: 1
  name: backend-webhook
  receivers:
  - uid: webhook-backend
    type: webhook
    settings:
      url: http://backend:8000/api/alerts
      httpMethod: POST
      authorization_scheme: Bearer
      authorization_credentials: $ALERT_TOKEN
policies:
- orgId: 1
  receiver: backend-webhook
  group_by:
  - alertname
  - device
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
groups:
- orgId: 1
  name: capstone-reglas
  folder: IoT Capstone
  interval: 1m
  rules:
  - uid: cpu-alta
    title: CPU alta en el equipo real
    condition: C
    for: 2m
    noDataState: OK
    execErrState: Error
    labels:
      device: real-pc-01
      severity: warning
    annotations:
      summary: Uso de CPU promedio > 85 % en 10 min
    data:
    - refId: A
      datasourceUid: influx
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        query: "from(bucket: \"iot\")\n  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)\n\
          \  |> filter(fn: (r) => r._measurement == \"telemetry\" and r.device ==\
          \ \"real-pc-01\" and r._field == \"cpu_pct\")\n  |> group(columns: [\"device\"\
          ])\n  |> mean()"
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 85
  - uid: latencia-alta
    title: Latencia de red alta
    condition: C
    for: 2m
    noDataState: OK
    execErrState: Error
