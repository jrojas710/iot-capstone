apiVersion: 1
datasources:
  - name: InfluxDB
    uid: influx
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    jsonData:
      version: Flux
      organization: $INFLUX_ORG
      defaultBucket: iot
      timeInterval: 30s
    secureJsonData:
      token: $INFLUX_TOKEN
