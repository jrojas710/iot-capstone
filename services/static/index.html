<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IoT Capstone · Panel de dispositivos</title>
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#1d2433;--muted:#667085;--line:#e4e0d6;--ok:#1f8a5b;--off:#b54434;
--real:#2f6fdf;--api:#c26a12;--twin:#7a3bb8;--dataset:#0f7c78}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:22px 28px 14px;display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between}
h1{margin:0;font-size:24px}header p{margin:2px 0 0;color:var(--muted)}
nav a{color:var(--ink);font-weight:600;margin-left:14px;text-decoration:none;border-bottom:2px solid var(--ink)}
main{padding:0 28px 40px}h2{font-size:15px;text-transform:uppercase;letter-spacing:.08em;margin:22px 0 10px;display:flex;gap:8px;align-items:center}
h2 i{width:10px;height:10px;border-radius:50%;display:inline-block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;border-top:4px solid var(--c)}
.top{display:flex;justify-content:space-between;align-items:center}.top b{font-size:16px}
.pill{font-size:12px;font-weight:700;padding:2px 9px;border-radius:20px;color:#fff;background:var(--ok)}.pill.off{background:var(--off)}.pill.stale{background:#98a2b3}
.meta{color:var(--muted);font-size:12.5px;margin:2px 0 8px}
table{width:100%;border-collapse:collapse;font-size:13.5px}td{padding:3px 0;border-bottom:1px dashed var(--line)}td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
details{margin-top:10px}summary{cursor:pointer;font-weight:600;font-size:13.5px}
.ctl{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.ctl input,.ctl select{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:8px;font:inherit}
button{border:0;border-radius:8px;padding:7px 10px;font:inherit;font-weight:600;cursor:pointer;background:var(--ink);color:#fff}
button.sec{background:#e9e5db;color:var(--ink)}.row{display:flex;gap:6px;margin-top:6px}.row>*{flex:1}
#toast{position:fixed;bottom:18px;right:18px;background:var(--ink);color:#fff;padding:10px 14px;border-radius:10px;display:none}
</style></head><body>
<header><div><h1>Plataforma IoT a la medida</h1><p>Bucaramanga · 12 dispositivos en 4 tipos · retroceso en tiempo real</p></div>
<nav><a href="/grafana/">Grafana</a><a href="/api/docs">API</a><a href="#" id="key">Llave admin</a></nav></header>
<main id="app">Cargando…</main><div id="toast"></div>
<script>
const KINDS={real:"Dispositivos reales",api:"API · Open-Meteo",twin:"Gemelos digitales",dataset:"DataSet UCI"};
let KEY=""; try{KEY=localStorage.getItem("iotkey")||""}catch(e){}
document.getElementById("key").onclick=e=>{e.preventDefault();KEY=prompt("Llave de administración (ADMIN_TOKEN)",KEY)||"";try{localStorage.setItem("iotkey",KEY)}catch(e){}};
const toast=m=>{const t=document.getElementById("toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",3500)};
async function send(id,cmd){
  if(!KEY){KEY=prompt("Llave de administración (ADMIN_TOKEN)")||"";try{localStorage.setItem("iotkey",KEY)}catch(e){}}
  const r=await fetch(`/api/devices/${id}/cmd`,{method:"POST",headers:{"Content-Type":"application/json","X-Api-Key":KEY},body:JSON.stringify(cmd)});
  toast(r.ok?`Comando enviado a ${id}`:`Error ${r.status}: ${(await r.json()).detail}`);setTimeout(load,1500);
}
const fmt=v=>typeof v==="number"?(Math.abs(v)>=100?v.toFixed(0):v.toFixed(2)):v;
function card(d){
  const st=d.state||{},on=st.power!=="off",stale=d.age_s===null||d.age_s>3*(st.period_s||60)+60;
  const vars=Object.keys(d.last||{}),sp=Object.keys(st.setpoint||{});
  const rows=vars.map(k=>`<tr><td>${k}</td><td>${fmt(d.last[k])}</td></tr>`).join("");
  const opt=a=>a.map(k=>`<option>${k}</option>`).join("");
  return `<div class="card" style="--c:var(--${d.kind})"><div class="top"><b>${d.id}</b>
  <span class="pill ${on?(stale?"stale":""):"off"}">${on?(stale?"sin datos":"encendido"):"apagado"}</span></div>
  <div class="meta">${st.protocol||""} · cada ${st.period_s||"?"} s · ${d.age_s!=null?"hace "+Math.round(d.age_s)+" s":"—"}</div>
  <table>${rows||"<tr><td>sin lecturas aún</td><td></td></tr>"}</table>
  <details><summary>Retroceso / control</summary>
   <div class="row"><button onclick='send("${d.id}",{power:"${on?"off":"on"}"})'>${on?"Apagar":"Encender"}</button>
   <button class="sec" onclick='send("${d.id}",{reset:true})'>Restablecer</button></div>
   <div class="ctl"><input id="p-${d.id}" type="number" min="5" placeholder="periodo (s)"><button class="sec" onclick='send("${d.id}",{period_s:+document.getElementById("p-${d.id}").value})'>Cambiar periodo</button>
   <select id="ov-${d.id}">${opt(vars)}</select><input id="o-${d.id}" type="number" step="any" placeholder="offset calibración">
   <span></span><button class="sec" onclick='send("${d.id}",{offset:{[document.getElementById("ov-${d.id}").value]:+document.getElementById("o-${d.id}").value}})'>Calibrar</button>
   ${sp.length?`<select id="sv-${d.id}">${opt(sp)}</select><input id="s-${d.id}" type="number" step="any" placeholder="nuevo valor">
   <span class="meta">actual: ${sp.map(k=>k+"="+st.setpoint[k]).join(", ")}</span><button class="sec" onclick='send("${d.id}",{setpoint:{[document.getElementById("sv-${d.id}").value]:+document.getElementById("s-${d.id}").value}})'>Ajustar</button>`:""}
   </div></details></div>`;
}
async function load(){
  try{const ds=await (await fetch("/api/devices")).json();
   document.getElementById("app").innerHTML=Object.keys(KINDS).map(k=>{const g=ds.filter(d=>d.kind===k);
    return g.length?`<h2><i style="background:var(--${k})"></i>${KINDS[k]} (${g.length})</h2><div class="grid">${g.map(card).join("")}</div>`:""}).join("")||"Esperando dispositivos…";
  }catch(e){document.getElementById("app").textContent="Sin conexión con el backend"}
}
load();setInterval(()=>{if(!document.querySelector("details[open]"))load()},5000);
</script></body></html>
